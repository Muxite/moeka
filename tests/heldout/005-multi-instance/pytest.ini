[pytest]
# Held-out tests for moeka spec 005-multi-instance. Self-contained: this file makes this
# directory the rootdir, so the implementer tree's pyproject/conftest are not used.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
timeout = 120
timeout_method = signal
markers =
    fr(*ids): requirement ids (FR-/SC-) this test proves
    docker: needs a working docker daemon (skipped otherwise)
    slow: long-running repetition / stress test
filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning
