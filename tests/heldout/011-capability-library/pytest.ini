[pytest]
# Held-out tests for moeka spec 011-capability-library. Self-contained: this file makes this
# directory the rootdir, so the implementer tree's pyproject/conftest are not used.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
timeout = 60
timeout_method = signal
addopts = -m "not bench"
markers =
    fr(*ids): requirement ids (FR-/NFR-/SC-) this test proves
    bench: performance benchmark (NFR-001 / SC-004); deselected by default, run with -m bench
filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning
