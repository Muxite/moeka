[project]
name = "moeka"
version = "0.2.1"
description = "Nanobot for server management — homelabs, Docker, and Linux administration"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Xubin Ren"},
    {name = "the nanobot contributors"}
]
keywords = ["ai", "agent", "chatbot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
]

dependencies = [
    "typer>=0.20.0,<1.0.0",
    "anthropic>=0.45.0,<1.0.0",
    "pydantic>=2.12.0,<3.0.0",
    "pydantic-settings>=2.12.0,<3.0.0",
    "websockets>=16.0,<17.0",
    "websocket-client>=1.9.0,<2.0.0",
    "httpx>=0.28.0,<1.0.0",
    "ddgs>=9.5.5,<10.0.0",
    "oauth-cli-kit>=0.1.6,<1.0.0",
    "loguru>=0.7.3,<1.0.0",
    "readability-lxml>=0.8.4,<1.0.0",
    "lxml-html-clean>=0.4.0,<1.0.0",
    "rich>=14.0.0,<15.0.0",
    "croniter>=6.0.0,<7.0.0",
    "prompt-toolkit>=3.0.50,<4.0.0",
    "questionary>=2.0.0,<3.0.0",
    "mcp>=1.26.0,<2.0.0",
    "json-repair>=0.57.0,<1.0.0",
    "chardet>=3.0.2,<6.0.0",
    "openai>=2.8.0",
    "tiktoken>=0.12.0,<1.0.0",
    "jinja2>=3.1.0,<4.0.0",
    "dulwich>=0.22.0,<1.0.0",
    "pyyaml>=6.0,<7.0.0",
    "filelock>=3.25.2",
    "watchfiles>=1.1.1,<2.0.0",
    "packaging>=24.0",
    "tzdata>=2025.2; sys_platform == 'win32'",
    "defusedxml>=0.7.1,<1.0.0",
    "pypdf>=5.0.0,<6.0.0",
    "python-docx>=1.1.0,<2.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    "python-pptx>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
# moeka-core: the reusable RAG/agentic "thinking core" (nanobot.core.MoekaCore).
# `from nanobot.core import MoekaCore` pulls no channel/gateway deps — the import
# boundary is enforced by tests/core/test_import_boundary.py. The base install is
# a superset; the `core` extra below names the minimal dependency surface the
# embedding path actually needs, so a host can audit/trim toward it (a fully
# separate slim wheel is not split out yet — this is the dependency contract).
# Add the `vec` extra for semantic RAG over memory, history, and host documents.
core = [
    "pydantic>=2.12.0,<3.0.0",
    "pydantic-settings>=2.12.0,<3.0.0",
    "anthropic>=0.45.0,<1.0.0",
    "openai>=2.8.0",
    "httpx>=0.28.0,<1.0.0",
    "loguru>=0.7.3,<1.0.0",
    "tiktoken>=0.12.0,<1.0.0",
    "jinja2>=3.1.0,<4.0.0",
    "filelock>=3.25.2",
    "json-repair>=0.57.0,<1.0.0",
    "croniter>=6.0.0,<7.0.0",
    "dulwich>=0.22.0,<1.0.0",
    "chardet>=3.0.2,<6.0.0",
    "pyyaml>=6.0,<7.0.0",
    # document ingestion (core.ingest); drop if RAG over files is not needed:
    "pypdf>=5.0.0,<6.0.0",
    "python-docx>=1.1.0,<2.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    "python-pptx>=1.0.0,<2.0.0",
]
api = [
    "aiohttp>=3.9.0,<4.0.0",
]
vec = [
    "sqlite-vec>=0.1.9,<1.0.0",
    "sentence-transformers>=5.0.0,<6.0.0",
]
azure = [
    "azure-identity>=1.19.0,<2.0.0",
]
bedrock = [
    "boto3>=1.43.0",
]
documents = [
    # Compatibility extra: document readers are bundled since v0.2.3.
    "defusedxml>=0.7.1,<1.0.0",
    "pypdf>=5.0.0,<6.0.0",
    "python-docx>=1.1.0,<2.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    "python-pptx>=1.0.0,<2.0.0",
]

olostep = [
    "olostep>=0.1.0",
]
langsmith = [
    "langsmith>=0.1.0",
]
langfuse = [
    "langfuse>=3.0.0,<4.0.0",
]
pdf = [
    # Compatibility extra: PDF reading is bundled since v0.2.3.
    "pypdf>=5.0.0,<6.0.0",
]
dev = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "pytest-timeout>=2.3.0,<3.0.0",
    "aiohttp>=3.9.0,<4.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    # Upper bound deliberate: ruff gates CI, and an unbounded range meant any
    # release that changed rule behaviour could redden the build with no repo
    # change. This was ">=0.1.0", spanning ~0.1 to 0.14 of rule churn.
    "ruff>=0.1.0,<0.15.0",
    "pymupdf>=1.25.0",
    "pypdf>=5.0.0,<6.0.0",
    "python-docx>=1.1.0,<2.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    "python-pptx>=1.0.0,<2.0.0",
    "python-socketio>=5.16.0,<6.0.0",
    "msgpack>=1.1.0,<2.0.0",
    # Channel runtimes are lazily pip-installed per nanobot/channels/*/manifest.py
    # (see optional_features.ensure_enabled_channel_dependencies) and intentionally
    # excluded from the base install. moeka's `nanobot channels enable/disable` CLI
    # tests use telegram as their reference channel, so pin its runtime deps here
    # (must match nanobot/channels/telegram/manifest.py) to keep it importable for
    # the dev/test environment.
    "python-telegram-bot[socks,webhooks]>=22.6,<23.0",
    "socksio>=1.0.0,<2.0.0",
    "python-socks[asyncio]>=2.8.0,<3.0.0; sys_platform != 'win32'",
]

[project.scripts]
nanobot = "nanobot.cli.commands:app"

# Third-party tool plugins register here.  Built-in tools are discovered
# automatically via pkgutil scanning in ToolLoader.discover().
# [project.entry-points."nanobot.tools"]
# my_plugin = "my_package.plugins:MyTool"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.hooks.custom]
# Implementation lives in the conventional `hatch_build.py` at the repo root.

[tool.hatch.build]
include = [
    "nanobot/**/*.py",
    "nanobot/templates/**/*.md",
    "nanobot/skills/**/*.md",
    "nanobot/skills/**/*.sh",
    "nanobot/channels/*/webui/**/*",
    "nanobot/web/dist/**/*",
]
# nanobot/web/dist/ is produced by `cd webui && bun run build` and is
# git-ignored. List it as an artifact so hatch ships it in both wheel and
# sdist even though VCS does not track it.
artifacts = [
    "nanobot/web/dist/**/*",
]

[tool.hatch.build.targets.wheel]
packages = ["nanobot"]
exclude = ["nanobot/channels/*/tests/**"]

[tool.hatch.build.targets.wheel.sources]
"nanobot" = "nanobot"

[tool.hatch.build.targets.sdist]
include = [
    "nanobot/",
    "nanobot/web/dist/",
    "hatch_build.py",
    "README.md",
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "pyproject.toml",
]
exclude = ["nanobot/channels/*/tests/**"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# E402 (import not at top) is correct-by-design in these two files:
#   cli/commands.py reconfigures sys.stdout/stderr to UTF-8 before importing
#   typer and loguru, which must happen first for emoji/multilingual output
#   (see .agent/gotchas.md, "Windows Compatibility").
#   __init__.py exposes a lazy __getattr__ module map to keep import cost down.
"nanobot/cli/commands.py" = ["E402"]
"nanobot/__init__.py" = ["E402"]
# Renaming the public exception FileSizeExceeded to satisfy N818's "...Error"
# convention would be a breaking API change for anything that catches it.
"nanobot/utils/media_decode.py" = ["N818"]
# tests/ is linted under --select F in CI (see .github/workflows/ci.yml), which
# catches the rules that indicate real defects: F401 unused imports, F811
# redefinition (a shadowed test class means its tests never run — there was one),
# and F821 undefined names. F841 (assigned-but-never-used local) is DEFERRED, not
# endorsed: 12 remain, all sampled ones benign (the assertion is on another
# object, or the value documents fixture state). Worth a separate cleanup pass;
# do not treat this line as permission to add more.
"tests/**" = ["F841"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Upstream moved per-channel tests into the channel packages, so both roots.
testpaths = ["tests", "nanobot/channels"]
# -ra: summarise skips/xfails. ~380 tests sit behind module-level importorskip
# for channel extras, and without a reason summary a dependency that silently
# failed to install is indistinguishable from a healthy run.
addopts = "-ra"
# A hung test used to burn the entire 20-minute job with no attribution: an
# asyncio server whose handler never closed the writer made Server.wait_closed()
# block forever on 3.12+. Per-test timeouts turn that into one named failure.
# Generous — the whole suite runs in ~170s, so nothing legitimate is near this.
timeout = 300
timeout_method = "thread"

[tool.coverage.run]
source = ["nanobot"]
omit = ["tests/*", "**/tests/*"]

[tool.coverage.report]
fail_under = 75
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[dependency-groups]
# Keep in step with [project.optional-dependencies].dev above. These two lists
# both exist and drifted: this one lacked ruff, so a plain `uv sync` produced an
# environment where the CI lint command could not run at all — it only worked
# because CI passes --all-extras and picks up the *extra* instead.
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-timeout>=2.3.0",
    "pytest-cov>=6.3.0",
    "ruff>=0.1.0,<0.15.0",
]
