name: Test Suite

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - .agent/**
      - .github/ISSUE_TEMPLATE/**
      - AGENTS.md
      - CLAUDE.md
      - COMMUNICATION.md
      - CONTRIBUTING.md
      - README.md
      - SECURITY.md
  pull_request:
    branches: [main]
    paths-ignore:
      - docs/**
      - .agent/**
      - .github/ISSUE_TEMPLATE/**
      - AGENTS.md
      - CLAUDE.md
      - COMMUNICATION.md
      - CONTRIBUTING.md
      - README.md
      - SECURITY.md

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      python_required: ${{ steps.paths.outputs.python_required }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Python-relevant changes
        id: paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          python_required=true

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            diff_range="${BASE_SHA}...${HEAD_SHA}"
          else
            diff_range="${BASE_SHA}..${HEAD_SHA}"
          fi

          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null &&
            changed_files="$(git diff --name-only --no-renames "$diff_range")" &&
            [[ -n "$changed_files" ]]; then
            python_required=false

            while IFS= read -r file; do
              case "$file" in
                .github/workflows/*)
                  # A workflow change must exercise every affected execution path.
                  python_required=true
                  ;;
                nanobot/*)
                  python_required=true
                  ;;
                pyproject.toml)
                  python_required=true
                  ;;
                tests/*|conftest.py|uv.lock|scripts/*)
                  python_required=true
                  ;;
                Dockerfile.*|.dockerignore|README.md|LICENSE|THIRD_PARTY_NOTICES.md)
                  ;;
                docs/*|.agent/*|.github/ISSUE_TEMPLATE/*|AGENTS.md|CLAUDE.md|COMMUNICATION.md|CONTRIBUTING.md|README.md|SECURITY.md|render.yaml)
                  # Documentation-only changes are already filtered at the event level.
                  ;;
                *)
                  # Keep new or unclassified paths covered until they are categorized.
                  python_required=true
                  ;;
              esac
            done <<< "$changed_files"
          fi

          echo "python_required=$python_required" >> "$GITHUB_OUTPUT"

  test:
    name: Python (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.python_required == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum, 3.11
            os: ubuntu-latest
            python-version: "3.11"
            coverage: false
            # CLI command tests assert exact Rich terminal output; run them
            # serially below so xdist cannot change terminal-width rendering.
            pytest_args: "-n auto --dist loadfile --ignore=tests/cli/test_commands.py"
          - name: latest, 3.14 + coverage
            os: ubuntu-latest
            python-version: "3.14"
            coverage: true
            pytest_args: "-n auto --dist loadfile --ignore=tests/cli/test_commands.py"
          - name: Windows, 3.14
            os: windows-latest
            python-version: "3.14"
            coverage: false
            # Real PowerShell/process-tree tests run serially in a separate
            # job. Keep them out of xdist so workers never share a console.
            pytest_args: "-n auto --dist loadfile --ignore=tests/cli/test_commands.py --ignore=tests/tools/test_exec_platform.py"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The vec tests download ~90MB of sentence-transformers weights on first
      # use and nothing sets HF_HUB_OFFLINE, so without this every leg hits
      # huggingface.co and a rate-limited runner fails for unrelated reasons.
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-all-MiniLM-L6-v2

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Verify dependency consistency
        run: uv pip check

      - name: Lint with ruff
        if: matrix.coverage
        run: uv run --no-sync ruff check nanobot tests conftest.py

      - name: Type check with BasedPyright (strict)
        if: matrix.coverage
        run: uv run --no-sync basedpyright

      # NANOBOT_MIN_TESTS: if an optional extra fails to resolve, its whole
      # test file vanishes from collection and CI would pass with fewer
      # tests. 4500 is the floor for the core-slim suite (last known count:
      # 4549 passed, 50 skipped in Docker at the Task 12 acceptance run).
      # Raise as the suite grows; never lower it.
      - name: Run tests with coverage
        if: matrix.coverage
        env:
          NANOBOT_MIN_TESTS: "4500"
        run: >-
          uv run --no-sync python -m pytest
          ${{ matrix.pytest_args }}
          --cov=nanobot --cov-report=term-missing:skip-covered
          --durations=25 --durations-min=1.0

      - name: Run serial CLI command tests with coverage
        if: matrix.coverage
        run: >-
          uv run --no-sync python -m pytest
          tests/cli/test_commands.py
          --cov=nanobot --cov-append --cov-report=term-missing:skip-covered
          --durations=25 --durations-min=1.0

      - name: Run compatibility tests
        if: ${{ !matrix.coverage }}
        env:
          NANOBOT_MIN_TESTS: "4500"
        run: >-
          uv run --no-sync python -m pytest
          ${{ matrix.pytest_args }}
          --durations=25 --durations-min=1.0

      - name: Run serial CLI command compatibility tests
        if: ${{ !matrix.coverage }}
        run: >-
          uv run --no-sync python -m pytest
          tests/cli/test_commands.py
          --durations=25 --durations-min=1.0

  windows_process:
    name: Python (Windows process compatibility)
    needs: changes
    if: needs.changes.outputs.python_required == 'true'
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Verify dependency consistency
        run: uv pip check

      - name: Run Windows process compatibility tests
        run: >-
          uv run --no-sync python -m pytest
          tests/tools/test_exec_platform.py
          --durations=25 --durations-min=1.0
